.wrap-go{max-width:640px;margin:20px auto;text-align:center}
#goCanvas{background:#e9bc7c;border:2px #885422 solid;width:100%;max-width:620px}
.info-bar{margin:12px 0;font-size:16px;color:#333}
.btn-group button{padding:7px 14px;margin:0 5px;border:none;background:#4477dd;color:#fff;border-radius:6px;cursor:pointer;font-size:15px}
.btn-group button:hover{background:#3366cc}
</style>
<div class="wrap-go">
  <div class="info-bar" id="info">黑方先行，请落子</div>
  <canvas id="goCanvas" width="620" height="620"></canvas>
  <div class="info-bar btn-group" style="margin-top:12px">
    <button onclick="restartGame()">重新开局</button>
    <button onclick="undoMove()">悔棋</button>
    <button onclick="passMove()">Pass（虚着）</button>
    <button onclick="countResult()">手动数目</button>
  </div>
</div>

<script>
// 全局变量前置声明，防止变量未定义报错
let canvas, ctx;
const size = 19;
const padding = 32;
const cell = (620 - padding*2)/(size-1);
const EMPTY = 0;
const BLACK = 1;
const WHITE = 2;

let board = [];
let turn = BLACK;
let history = [];
let lastKoPos = null;
let gameOver = false;
let passCount = 0;
let infoDom;

// 星位天元坐标
const starPoints = [
  [3,3],[3,9],[3,15],
  [9,3],[9,9],[9,15],
  [15,3],[15,9],[15,15]
];

// 获取上下左右相邻点位
function getNeigh(x,y){
  let list=[];
  if(x>0)list.push([x-1,y]);
  if(x<size-1)list.push([x+1,y]);
  if(y>0)list.push([x,y-1]);
  if(y<size-1)list.push([x,y+1]);
  return list;
}

// 获取棋子连通块、气数
function getGroup(x,y,bd=board){
  const color = bd[y][x];
  const visited = new Set();
  const group = [];
  let liberty = 0;
  const q = [[x,y]];
  visited.add(`${x},${y}`);
  while(q.length>0){
    const [cx,cy] = q.shift();
    group.push([cx,cy]);
    for(const [nx,ny] of getNeigh(cx,cy)){
      const key = `${nx},${ny}`;
      if(bd[ny][nx] === EMPTY){
        liberty++;
      }else if(bd[ny][nx] === color && !visited.has(key)){
        visited.add(key);
        q.push([nx,ny]);
      }
    }
  }
  return {group, liberty};
}

// 执行提子逻辑
function executeCapture(x,y,color,bd){
  const opp = color === BLACK ? WHITE : BLACK;
  let captured = [];
  for(const [nx,ny] of getNeigh(x,y)){
    if(bd[ny][nx] === opp){
      const g = getGroup(nx,ny,bd);
      if(g.liberty === 0) captured.push(...g.group);
    }
  }
  for(const [cx,cy] of captured) bd[cy][cx] = EMPTY;
  return captured.length;
}

// 棋盘快照备份
function snapshot(b){
  return b.map(r=>[...r]);
}

// 校验落子合法性（禁入点、打劫、自杀校验）
function isValidMove(x,y){
  if(board[y][x] !== EMPTY) return false;
  const temp = snapshot(board);
  temp[y][x] = turn;
  const cap = executeCapture(x,y,turn,temp);
  const self = getGroup(x,y,temp);
  // 自杀判定：无气且无法提子
  if(self.liberty === 0 && cap === 0) return false;
  // 简易打劫防回提
  if(cap === 1 && lastKoPos && lastKoPos[0] === x && lastKoPos[1] === y){
    return false;
  }
  return true;
}

// 正式落子操作
function placeStone(x,y){
  const snap = snapshot(board);
  board[y][x] = turn;
  const cap = executeCapture(x,y,turn,board);
  lastKoPos = cap === 1 ? [x,y] : null;
  passCount = 0;
  history.push({x,y,board:snap,turn});
  drawBoard();
}

// Pass虚着操作
function passMove(){
  if(gameOver) return;
  passCount++;
  history.push({pass:true, turn});
  if(passCount >=2){
    gameOver = true;
    setTimeout(()=>countResult(), 300);
    infoDom.innerText = "双方连续Pass，对局结束，正在数目";
  }else{
    turn = turn === BLACK ? WHITE : BLACK;
    infoDom.innerText = turn===BLACK?"轮到【黑方】落子":"轮到【白方】落子";
    if(turn === WHITE && !gameOver) aiThink();
  }
}

// 核心绘制棋盘网格、星位、棋子
function drawBoard(){
  // 兜底校验画布上下文
  if(!ctx) return;
  ctx.clearRect(0,0,620,620);
  // 棋盘底色
  ctx.fillStyle='#e9bc7c';
  ctx.fillRect(0,0,620,620);
  ctx.strokeStyle='#222';
  ctx.lineWidth=1;
  // 横竖棋盘线绘制
  for(let i=0;i<size;i++){
    const p = padding + i*cell;
    ctx.beginPath();ctx.moveTo(p,padding);ctx.lineTo(p,620-padding);ctx.stroke();
    ctx.beginPath();ctx.moveTo(padding,p);ctx.lineTo(620-padding,p);ctx.stroke();
  }
  // 绘制星位点
  ctx.fillStyle='#222';
  for(const [x,y] of starPoints){
    const px = padding + x*cell;
    const py = padding + y*cell;
    ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();
  }
  // 遍历绘制黑白棋子
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const c = board[y][x];
      if(c === EMPTY) continue;
      const px = padding + x*cell;
      const py = padding + y*cell;
      ctx.beginPath();
      ctx.arc(px,py,cell*0.42,0,Math.PI*2);
      ctx.fillStyle = c === BLACK ? '#111' : '#f8f8f8';
      ctx.fill();
      ctx.strokeStyle='#333';
      ctx.lineWidth=1;
      ctx.stroke();
    }
  }
}

// AI白棋思考逻辑
function aiThink(){
  infoDom.innerText = "AI思考中……";
  setTimeout(()=>{
    let candidates = [];
    for(let y=0;y<size;y++){
      for(let x=0;x<size;x++){
        if(isValidMove(x,y)){
          const score = aiEvaluate(x,y);
          candidates.push({x,y,score});
        }
      }
    }
    if(candidates.length === 0){
      infoDom.innerText = "AI无棋可下，选择Pass";
      turn = WHITE;
      passMove();
      return;
    }
    candidates.sort((a,b)=>b.score - a.score);
    const topScore = candidates[0].score;
    const topList = candidates.filter(c=>c.score === topScore);
    const pick = topList[Math.floor(Math.random()*topList.length)];
    turn = WHITE;
    placeStone(pick.x,pick.y);
    turn = BLACK;
    infoDom.innerText = "轮到【黑方】落子";
  },450);
}

// AI点位估值打分
function aiEvaluate(x,y){
  let score = 0;
  const sim = snapshot(board);
  sim[y][x] = WHITE;
  const cap = executeCapture(x,y,WHITE,sim);
  score += cap * 150;
  const group = getGroup(x,y,sim);
  score += group.liberty * 14;
  for(const [nx,ny] of getNeigh(x,y)){
    if(sim[ny][nx] === WHITE) score += 22;
    if(sim[ny][nx] === BLACK) score += 8;
  }
  const distCenter = Math.abs(x-9)+Math.abs(y-9);
  score += Math.max(0,18-distCenter)*1.6;
  for(const [nx,ny] of getNeigh(x,y)){
    if(sim[ny][nx] === BLACK){
      const bg = getGroup(nx,ny,sim);
      if(bg.liberty <=3) score += 35;
    }
  }
  if(group.liberty === 0 && cap ===0) score -= 9999;
  return score;
}

// 终局数目结算（中国数子规则，黑贴3.75子）
function countResult(){
  const tempBoard = snapshot(board);
  function removeDeadStones(color){
    for(let y=0;y<size;y++){
      for(let x=0;x<size;x++){
        if(tempBoard[y][x] === color){
          const g = getGroup(x,y,tempBoard);
          if(g.liberty <=1){
            for(const [cx,cy] of g.group) tempBoard[cy][cx] = EMPTY;
          }
        }
      }
    }
  }
  removeDeadStones(BLACK);
  removeDeadStones(WHITE);
  let blackStone = 0, whiteStone =0;
  let blackArea =0, whiteArea =0;
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const c = tempBoard[y][x];
      if(c === BLACK) blackStone++;
      else if(c === WHITE) whiteStone++;
      else {
        let b=0,w=0;
        const ns = getNeigh(x,y);
        for(const [nx,ny] of ns){
          if(tempBoard[ny][nx] === BLACK) b++;
          if(tempBoard[ny][nx] === WHITE) w++;
        }
        if(b>w) blackArea++;
        else if(w>b) whiteArea++;
      }
    }
  }
  const blackTotal = blackStone + blackArea;
  const whiteTotal = whiteStone + whiteArea;
  const blackFinal = blackTotal - 3.75;
  let msg = `【数目结果】\n黑子：${blackStone} 空：${blackArea} 合计：${blackTotal}\n白子：${whiteStone} 空：${whiteArea} 合计：${whiteTotal}\n黑贴3.75子\n黑最终：${blackFinal.toFixed(2)}`;
  msg += blackFinal > whiteTotal ? `\n✅ 黑棋胜！` : `\n✅ 白棋胜！`;
  alert(msg);
}

// 画布点击落子绑定
function bindCanvasClick(){
  canvas.onclick = function(e){
    if(gameOver || turn !== BLACK) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const xi = Math.round((mx-padding)/cell);
    const yi = Math.round((my-padding)/cell);
    const x = Math.max(0,Math.min(size-1,xi));
    const y = Math.max(0,Math.min(size-1,yi));
    if(!isValidMove(x,y)){
      infoDom.innerText="非法落子（禁入点/已有棋子）";
      return;
    }
    placeStone(x,y);
    turn = WHITE;
    infoDom.innerText = "等待AI落子……";
    aiThink();
  }
}

// 重新开局初始化
function restartGame(){
  // 强制重新获取DOM元素，适配PJAX刷新
  canvas = document.getElementById('goCanvas');
  ctx = canvas.getContext('2d');
  infoDom = document.getElementById('info');
  board = Array(size).fill().map(()=>Array(size).fill(EMPTY));
  turn=BLACK;
  history=[];
  lastKoPos=null;
  gameOver=false;
  passCount=0;
  infoDom.innerText="黑方先行，请落子";
  bindCanvasClick();
  drawBoard();
}

// 悔棋功能（撤回玩家+AI两步）
function undoMove(){
  if(history.length <2) return alert("步数不足，无法悔棋");
  history.pop();
  const prev = history.pop();
  board = prev.board;
  lastKoPos = null;
  turn = BLACK;
  drawBoard();
  infoDom.innerText="已悔棋，黑方继续落子";
}

// 页面加载完成兜底初始化，解决PJAX加载时序问题
window.addEventListener('load',()=>{
  setTimeout(restartGame,200);
});
// 适配安知鱼PJAX页面跳转后自动初始化
document.addEventListener('pjax:complete',()=>{
  setTimeout(restartGame,300);
});
</script>

<script>
(function() {
  var ball = document.getElementById('musicBall');
  var btn = document.getElementById('musicBallBtn');
  if (!ball || !btn) return;

  var ap = null;
  var playlist = [];
  var currentIndex = 0;
  var audio = new Audio();
  var isPlaying = false;
  var inited = false;

  // 切换面板
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    ball.classList.toggle('open');
    if (ball.classList.contains('open') && !inited) {
      inited = true;
      loadPlayer();
    }
  });

  // 点击外部关闭
  document.addEventListener('click', function(e) {
    if (!ball.contains(e.target)) ball.classList.remove('open');
  });

  function loadPlayer() {
    // 加载 Aplayer CSS
    if (!document.getElementById('aplayer-css')) {
      var link = document.createElement('link');
      link.id = 'aplayer-css';
      link.rel = 'stylesheet';
      link.href = 'https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css';
      document.head.appendChild(link);
    }
    // 加载 Aplayer JS
    loadScript('https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js', function() {
      loadScript('https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js', function() {
        initAplayer();
      });
    });
  }

  function initAplayer() {
    ap = new APlayer({
      container: document.getElementById('musicBallAplayer'),
      mini: false,
      autoplay: false,
      theme: '#667eea',
      loop: 'all',
      order: 'list',
      preload: 'auto',
      volume: 0.7,
      mutex: true,
      listFolded: true,
      lrcType: 0,
      audio: []
    });

    // 用 MetingJS 获取歌单
    if (typeof Meting !== 'undefined') {
      var meting = new Meting({
        server: 'netease',
        type: 'playlist',
        id: '8152976493'
      });
      meting.fetch().then(function(data) {
        if (data && data.length) {
          playlist = data;
          ap.list.add(data);
          updateSongInfo(data[0]);
        } else {
          document.getElementById('musicBallTitle').textContent = '歌单为空';
        }
      }).catch(function(err) {
        console.error('Meting fetch error:', err);
        document.getElementById('musicBallTitle').textContent = '加载失败，请检查歌单ID';
      });
    }

    // 事件
    ap.on('play', function() {
      isPlaying = true;
      ball.classList.add('playing');
      document.getElementById('musicBallPlayIcon').className = 'fas fa-pause';
    });
    ap.on('pause', function() {
      isPlaying = false;
      ball.classList.remove('playing');
      document.getElementById('musicBallPlayIcon').className = 'fas fa-play';
    });
    ap.on('timeupdate', function() {
      var cur = ap.audio.currentTime;
      var dur = ap.audio.duration || 0;
      document.getElementById('musicBallProgressBar').style.width = (dur ? (cur/dur*100) : 0) + '%';
      document.getElementById('musicBallCurrent').textContent = formatTime(cur);
      document.getElementById('musicBallDuration').textContent = formatTime(dur);
    });
    ap.on('switch', function() {
      if (ap.list.audios[ap.index]) updateSongInfo(ap.list.audios[ap.index]);
    });

    // 控制按钮
    document.getElementById('musicBallPlay').addEventListener('click', function(e) {
      e.stopPropagation();
      ap.toggle();
    });
    document.getElementById('musicBallPrev').addEventListener('click', function(e) {
      e.stopPropagation();
      ap.skipBack();
    });
    document.getElementById('musicBallNext').addEventListener('click', function(e) {
      e.stopPropagation();
      ap.skipForward();
    });

    // 进度条
    document.getElementById('musicBallProgress').addEventListener('click', function(e) {
      e.stopPropagation();
      var rect = this.getBoundingClientRect();
      var percent = (e.clientX - rect.left) / rect.width;
      if (ap.audio.duration) ap.seek(percent * ap.audio.duration);
    });

    // 音量
    var volBtn = document.getElementById('musicBallVolume');
    var volSlider = document.getElementById('musicBallVolumeSlider');
    var volInput = document.getElementById('musicBallVolumeInput');
    volBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      volSlider.classList.toggle('show');
    });
    volInput.addEventListener('input', function() {
      ap.volume(this.value / 100);
    });
  }

  function updateSongInfo(song) {
    if (!song) return;
    document.getElementById('musicBallTitle').textContent = song.name || song.title || '未知歌曲';
    document.getElementById('musicBallArtist').textContent = song.artist || song.author || '未知歌手';
    var cover = song.cover || song.pic || song.picture || '';
    if (cover) {
      document.getElementById('musicBallCover').src = cover;
      document.getElementById('musicBallCoverLarge').src = cover;
    }
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return '00:00';
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function loadScript(src, cb) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = function() {
      document.getElementById('musicBallTitle').textContent = '播放器加载失败';
    };
    document.head.appendChild(s);
  }
})();
</script>

  <!-- 苹果开机动画 -->
  
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    if (sessionStorage.getItem('macos_boot_shown')) {
      var s = document.getElementById('bootScreen');
      if (s) s.remove();
      return;
    }
    sessionStorage.setItem('macos_boot_shown', '1');
    var duration = 3000;
    var screen = document.getElementById('bootScreen');
    var bar = document.getElementById('bootProgressBar');
    if (!screen || !bar) return;
    var startTime = Date.now();
    function update() {
      var elapsed = Date.now() - startTime;
      var progress = Math.min(elapsed / duration, 1);
      bar.style.width = (progress * 100) + '%';
      if (progress < 1) {
        requestAnimationFrame(update);
      } else {
        setTimeout(function() {
          screen.classList.add('hide');
          setTimeout(function() { screen.remove(); }, 700);
        }, 200);
      }
    }
    requestAnimationFrame(update);
  });
  </script>

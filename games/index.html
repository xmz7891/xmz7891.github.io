<p>顶金色方块出金币/蘑菇，踩死小怪，吃蘑菇变大，碰到食人花扣生命，到达绿色旗杆通关</p>

<script>
// 全局基础变量
let canvas, ctx;
let gameRunning = false;
let rafId = null;
let audioCtx = null;
const keys = {left:false,right:false,jump:false};
let joyX = 0;

// 玩家配置
const player = {
  x:40,y:310,w:32,h:32,
  speed:4,vx:0,vy:0,gravity:0.6,jumpPower:-14,
  onGround:false,facingRight:true,
  big:false,life:3,score:0,level:1,
  walkFrame:0,walkTimer:0
};
let cameraX = 0;
const mapMaxWidth = 2600;

// 场景资源数据
const cloudList = [
  {x:120,y:60,w:70,h:32},{x:420,y:80,w:80,h:36},{x:780,y:55,w:72,h:33},
  {x:1100,y:72,w:76,h:34},{x:1450,y:64,w:82,h:38},{x:1800,y:76,w:74,h:32},
  {x:2100,y:60,w:80,h:35},{x:2400,y:82,w:70,h:31}
];
const grounds = [
  {x:0,y:388,w:2600,h:32},{x:180,y:310,w:128,h:32},{x:360,y:250,w:128,h:32},
  {x:560,y:300,w:128,h:32},{x:740,y:210,w:160,h:32},{x:960,y:270,w:128,h:32},
  {x:1180,y:190,w:180,h:32},{x:1420,y:250,w:128,h:32},{x:1640,y:290,w:144,h:32},
  {x:1860,y:230,w:128,h:32},{x:2080,y:170,w:180,h:32},{x:2300,y:280,w:140,h:32}
];
const pipes = [
  {x:580,y:340,w:52,h:48,flower:true,flowerTimer:0,flowerUp:false},
  {x:980,y:320,w:52,h:68,flower:true,flowerTimer:0,flowerUp:false},
  {x:1440,y:330,w:52,h:58,flower:true,flowerTimer:0,flowerUp:false},
  {x:1840,y:290,w:52,h:88,flower:true,flowerTimer:0,flowerUp:false}
];
const bricks = [
  {x:220,y:278,w:32,h:32,type:"brick"},{x:252,y:278,w:32,h:32,type:"coin"},{x:284,y:278,w:32,h:32,type:"mushroom"},
  {x:540,y:278,w:32,h:32,type:"brick"},{x:572,y:278,w:32,h:32,type:"coin"},{x:720,y:198,w:32,h:32,type:"mushroom"},
  {x:752,y:198,w:32,h:32,type:"coin"},{x:920,y:258,w:32,h:32,type:"brick"},{x:952,y:258,w:32,h:32,type:"coin"},
  {x:1140,y:178,w:32,h:32,type:"mushroom"},{x:1172,y:178,w:32,h:32,type:"coin"},{x:1370,y:238,w:32,h:32,type:"brick"},
  {x:1402,y:238,w:32,h:32,type:"coin"},{x:1570,y:278,w:32,h:32,type:"mushroom"},{x:1602,y:278,w:32,h:32,type:"coin"},
  {x:1770,y:218,w:32,h:32,type:"brick"},{x:1802,y:218,w:32,h:32,type:"coin"},{x:1970,y:158,w:32,h:32,type:"mushroom"},
  {x:2002,y:158,w:32,h:32,type:"coin"}
];
let enemies = [
  {x:300,y:356,w:32,h:32,vx:-1.1,alive:true},{x:460,y:356,w:32,h:32,vx:1.1,alive:true},
  {x:740,y:208,w:32,h:32,vx:-1,alive:true},{x:940,y:268,w:32,h:32,vx:1,alive:true},
  {x:1180,y:188,w:32,h:32,vx:-1.1,alive:true},{x:1380,y:248,w:32,h:32,vx:1.1,alive:true},
  {x:1580,y:288,w:32,h:32,vx:-1,alive:true},{x:1780,y:228,w:32,h:32,vx:1,alive:true},
  {x:1980,y:148,w:32,h:32,vx:-1.1,alive:true},{x:2280,y:356,w:32,h:32,vx:1.1,alive:true}
];
let coinItems = [];
let mushroomItems = [];
const flag = {x:2480,y:200,w:22,h:188};

// 音效工具函数
function initAudio(){
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.08,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  osc.start();osc.stop(audioCtx.currentTime+dur);
}
function soundCoin(){playTone(880,0.12);}
function soundJump(){playTone(220,0.08);}
function soundMushroom(){playTone(440,0.25);}
function soundDie(){playTone(110,0.4);}
function soundWin(){playTone(523,0.15);setTimeout(()=>playTone(659,0.15),160);setTimeout(()=>playTone(784,0.25),320);}

// 碰撞检测
function isCollide(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
// 玩家重置
function resetPlayerPos(){
  player.x=40;player.y=310;player.vx=0;player.vy=0;cameraX=0;player.big=false;
}
function nextLevel(){
  soundWin();
  player.level+=1;
  alert(`🎉通关！第${player.level}关，得分：${player.score}`);
  resetPlayerPos();
  enemies.forEach(e=>e.alive=true);
}
function playerHurt(){
  soundDie();
  if(player.big){
    player.big=false;
  }else{
    player.life -=1;
    if(player.life <=0){
      alert(`💀游戏结束！总得分：${player.score}`);
      player.life=3;player.score=0;player.level=1;
    }
  }
  resetPlayerPos();
}

// 游戏主循环
function gameLoop(){
  if(!gameRunning) return;
  rafId = requestAnimationFrame(gameLoop);
  ctx.fillStyle="#5c94fc";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // 玩家移动
  player.vx =0;
  if(keys.left){player.vx=-player.speed;player.facingRight=false;}
  if(keys.right){player.vx=player.speed;player.facingRight=true;}
  player.x += player.vx;
  if(player.x<0) player.x=0;
  if(player.x>mapMaxWidth-player.w) player.x = mapMaxWidth-player.w;

  // 走路动画
  if(player.vx!==0 && player.onGround){
    player.walkTimer +=1;
    if(player.walkTimer>8){player.walkFrame=(player.walkFrame+1)%4;player.walkTimer=0;}
  }else player.walkFrame=0;

  // 跳跃重力
  if(keys.jump && player.onGround){
    player.vy = player.jumpPower;
    player.onGround=false;
  }
  player.vy += player.gravity;
  player.y += player.vy;
  player.onGround = false;

  // 地面碰撞
  grounds.forEach(g=>{
    if(isCollide(player,g) && player.vy>0){
      player.y = g.y-player.h;
      player.vy=0;
      player.onGround=true;
    }
  });

  // 管道+食人花
  pipes.forEach(p=>{
    p.flowerTimer +=1;
    if(p.flowerTimer>80){p.flowerUp=!p.flowerUp;p.flowerTimer=0;}
    if(isCollide(player,p)){
      if(player.vx>0) player.x = p.x-player.w;
      if(player.vx<0) player.x = p.x+p.w;
      if(player.vy>0 && player.y+player.h < p.y+22){
        player.y = p.y-player.h;player.vy=0;player.onGround=true;
      }
    }
    if(p.flowerUp){
      const flowerBox = {x:p.x+8,y:p.y-32,w:36,h:32};
      if(isCollide(player,flowerBox)) playerHurt();
    }
  });

  // 顶砖块逻辑
  bricks.forEach(br=>{
    if(isCollide(player,br) && player.vy<0){
      player.vy=0;
      if(br.type === "coin"){
        coinItems.push({x:br.x,y:br.y-22,w:20,h:20,vy:-4});
        br.type = "empty";
        player.score +=10; soundCoin();
      }else if(br.type === "mushroom"){
        mushroomItems.push({x:br.x,y:br.y-32,w:28,h:28,vx:1});
        br.type = "empty";
        soundMushroom();
      }
    }
  });

  // 金币物理
  coinItems.forEach((c,idx)=>{
    c.vy +=0.25; c.y +=c.vy;
    if(c.y>420) coinItems.splice(idx,1);
  });
  // 蘑菇拾取
  mushroomItems.forEach((m,idx)=>{
    m.x += m.vx;
    if(isCollide(player,m)){
      player.big=true;player.score+=100; soundMushroom();
      mushroomItems.splice(idx,1);
    }
  });

  // 小怪逻辑
  enemies.forEach(e=>{
    if(!e.alive) return;
    e.x += e.vx;
    if(e.x<80||e.x>mapMaxWidth-80) e.vx *=-1;
    if(isCollide(player,e)){
      if(player.vy>0 && player.y+player.h < e.y+18){
        e.alive=false; player.vy =-9; player.score +=50;
      }else playerHurt();
    }
  });

  // 通关旗杆
  if(player.x>flag.x) nextLevel();

  // 相机跟随
  cameraX = player.x - canvas.width/3;
  if(cameraX<0) cameraX=0;
  if(cameraX>mapMaxWidth-canvas.width) cameraX = mapMaxWidth-canvas.width;

  ctx.save();
  ctx.translate(-cameraX,0);
  // 绘制云朵
  ctx.fillStyle="#ffffff";
  cloudList.forEach(c=>{
    ctx.beginPath();
    ctx.arc(c.x+15,c.y+12,14,0,Math.PI*2);
    ctx.arc(c.x+38,c.y+8,18,0,Math.PI*2);
    ctx.arc(c.x+60,c.y+14,13,0,Math.PI*2);
    ctx.fill();
  });
  // 地面
  ctx.fillStyle="#8b572a";
  grounds.forEach(g=>ctx.fillRect(g.x,g.y,g.w,g.h));
  // 管道
  pipes.forEach(p=>{
    ctx.fillStyle="#2e993e";
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle="#48bb5b";
    ctx.fillRect(p.x+5,p.y+4,p.w-10,p.h-8);
    if(p.flowerUp){
      ctx.fillStyle="#ff2222";
      ctx.fillRect(p.x+8,p.y-32,36,32);
      ctx.fillStyle="#ffdd22";
      ctx.fillRect(p.x+16,p.y-24,18,18);
    }
  });
  // 砖块
  bricks.forEach(b=>{
    if(b.type==="coin") ctx.fillStyle="#ffd300";
    else if(b.type==="mushroom") ctx.fillStyle="#ff8800";
    else if(b.type==="empty") ctx.fillStyle="#b89228";
    else ctx.fillStyle="#9c5c30";
    ctx.fillRect(b.x,b.y,b.w,b.h);
  });
  // 金币、蘑菇、小怪、旗杆
  ctx.fillStyle="#ffdd00";
  coinItems.forEach(c=>ctx.fillRect(c.x,c.y,c.w,c.h));
  ctx.fillStyle="#ff4433";
  mushroomItems.forEach(m=>ctx.fillRect(m.x,m.y,m.w,m.h));
  ctx.fillStyle="#208020";
  enemies.forEach(e=>{if(e.alive) ctx.fillRect(e.x,e.y,e.w,e.h);});
  ctx.fillStyle="#009922";
  ctx.fillRect(flag.x,flag.y,flag.w,flag.h);
  // 马里奥绘制
  if(player.big){
    ctx.fillStyle="#ff2222";
    ctx.fillRect(player.x,player.y-16,player.w,player.h+16);
  }else{
    ctx.fillStyle="#ff2222";
    ctx.fillRect(player.x,player.y,player.w,player.h);
  }
  ctx.restore();

  // UI文字
  ctx.fillStyle="#ffffff";
  ctx.font="bold 17px Arial";
  ctx.fillText(`得分：${player.score}`,22,30);
  ctx.fillText(`生命：${player.life}`,130,30);
  ctx.fillText(`第${player.level}关`,canvas.width-110,30);
}

<script>
(function() {
  var ball = document.getElementById('musicBall');
  var btn = document.getElementById('musicBallBtn');
  if (!ball || !btn) return;

  var ap = null;
  var playlist = [];
  var currentIndex = 0;
  var audio = new Audio();
  var isPlaying = false;
  var inited = false;

  // 切换面板
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    ball.classList.toggle('open');
    if (ball.classList.contains('open') && !inited) {
      inited = true;
      loadPlayer();
    }
  });

  // 点击外部关闭
  document.addEventListener('click', function(e) {
    if (!ball.contains(e.target)) ball.classList.remove('open');
  });

  function loadPlayer() {
    // 加载 Aplayer CSS
    if (!document.getElementById('aplayer-css')) {
      var link = document.createElement('link');
      link.id = 'aplayer-css';
      link.rel = 'stylesheet';
      link.href = 'https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css';
      document.head.appendChild(link);
    }
    // 加载 Aplayer JS
    loadScript('https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js', function() {
      loadScript('https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js', function() {
        initAplayer();
      });
    });
  }

  function initAplayer() {
    ap = new APlayer({
      container: document.getElementById('musicBallAplayer'),
      mini: false,
      autoplay: false,
      theme: '#667eea',
      loop: 'all',
      order: 'list',
      preload: 'auto',
      volume: 0.7,
      mutex: true,
      listFolded: true,
      lrcType: 0,
      audio: []
    });

    // 用 MetingJS 获取歌单
    if (typeof Meting !== 'undefined') {
      var meting = new Meting({
        server: 'netease',
        type: 'playlist',
        id: '8152976493'
      });
      meting.fetch().then(function(data) {
        if (data && data.length) {
          playlist = data;
          ap.list.add(data);
          updateSongInfo(data[0]);
        } else {
          document.getElementById('musicBallTitle').textContent = '歌单为空';
        }
      }).catch(function(err) {
        console.error('Meting fetch error:', err);
        document.getElementById('musicBallTitle').textContent = '加载失败，请检查歌单ID';
      });
    }

    // 事件
    ap.on('play', function() {
      isPlaying = true;
      ball.classList.add('playing');
      document.getElementById('musicBallPlayIcon').className = 'fas fa-pause';
    });
    ap.on('pause', function() {
      isPlaying = false;
      ball.classList.remove('playing');
      document.getElementById('musicBallPlayIcon').className = 'fas fa-play';
    });
    ap.on('timeupdate', function() {
      var cur = ap.audio.currentTime;
      var dur = ap.audio.duration || 0;
      document.getElementById('musicBallProgressBar').style.width = (dur ? (cur/dur*100) : 0) + '%';
      document.getElementById('musicBallCurrent').textContent = formatTime(cur);
      document.getElementById('musicBallDuration').textContent = formatTime(dur);
    });
    ap.on('switch', function() {
      if (ap.list.audios[ap.index]) updateSongInfo(ap.list.audios[ap.index]);
    });

    // 控制按钮
    document.getElementById('musicBallPlay').addEventListener('click', function(e) {
      e.stopPropagation();
      ap.toggle();
    });
    document.getElementById('musicBallPrev').addEventListener('click', function(e) {
      e.stopPropagation();
      ap.skipBack();
    });
    document.getElementById('musicBallNext').addEventListener('click', function(e) {
      e.stopPropagation();
      ap.skipForward();
    });

    // 进度条
    document.getElementById('musicBallProgress').addEventListener('click', function(e) {
      e.stopPropagation();
      var rect = this.getBoundingClientRect();
      var percent = (e.clientX - rect.left) / rect.width;
      if (ap.audio.duration) ap.seek(percent * ap.audio.duration);
    });

    // 音量
    var volBtn = document.getElementById('musicBallVolume');
    var volSlider = document.getElementById('musicBallVolumeSlider');
    var volInput = document.getElementById('musicBallVolumeInput');
    volBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      volSlider.classList.toggle('show');
    });
    volInput.addEventListener('input', function() {
      ap.volume(this.value / 100);
    });
  }

  function updateSongInfo(song) {
    if (!song) return;
    document.getElementById('musicBallTitle').textContent = song.name || song.title || '未知歌曲';
    document.getElementById('musicBallArtist').textContent = song.artist || song.author || '未知歌手';
    var cover = song.cover || song.pic || song.picture || '';
    if (cover) {
      document.getElementById('musicBallCover').src = cover;
      document.getElementById('musicBallCoverLarge').src = cover;
    }
  }

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return '00:00';
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function loadScript(src, cb) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = function() {
      document.getElementById('musicBallTitle').textContent = '播放器加载失败';
    };
    document.head.appendChild(s);
  }
})();
</script>

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    if (sessionStorage.getItem('macos_boot_shown')) {
      var s = document.getElementById('bootScreen');
      if (s) s.remove();
      return;
    }
    sessionStorage.setItem('macos_boot_shown', '1');
    var duration = 3000;
    var screen = document.getElementById('bootScreen');
    var bar = document.getElementById('bootProgressBar');
    if (!screen || !bar) return;
    var startTime = Date.now();
    function update() {
      var elapsed = Date.now() - startTime;
      var progress = Math.min(elapsed / duration, 1);
      bar.style.width = (progress * 100) + '%';
      if (progress < 1) {
        requestAnimationFrame(update);
      } else {
        setTimeout(function() {
          screen.classList.add('hide');
          setTimeout(function() { screen.remove(); }, 700);
        }, 200);
      }
    }
    requestAnimationFrame(update);
  });
  </script>
